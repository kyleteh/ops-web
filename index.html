<script>
/* Phase 2 static shell: resolve /exec API URL + banner when missing. */
(function () {
  var DEFAULT_API = "";
  window.OPS_ENC = {"v": 1, "it": 600000, "s": "tS8OaA5DELaXm7qmZshXgQ==", "iv": "mOZSBWlh9G2asBsP", "ct": "86hJy7ppFE2Ci+qFgYfPFtviAVPuoEjOmq/xBruxya6UAZ++zoBfHNP/ijokk29jk6+a351OlgbBw8uboFg9pu/nOoI7iPlkqV3vUY/lgACHfoGnhU6glvkFFyRPeesKZ0/MnH4K3VVcxK+NrfBja7WFY5XDDA5DTf18P4RVP00="};
  function hashParam(name) {
    var h = String(location.hash || '');
    var m = h.match(new RegExp('(?:^#|&)' + name + '=([^&]*)'));
    if (!m) return '';
    try { return decodeURIComponent(m[1].replace(/\+/g, '%20')); } catch (e) { return m[1]; }
  }
  function fromHash() { return hashParam('api'); }
  /* one-click setup link (#api=<exec>&key=<key>): same form the key prompt saves (no spaces, lower-case);
     a 24-character key typed without dashes gets them back (xxxx-xxxx-…), which is the form the server checks */
  function keyFromHash() {
    var k = hashParam('key').replace(/\s+/g, '').toLowerCase();
    if (/^[a-z0-9]{24}$/.test(k)) k = k.match(/.{4}/g).join('-');
    return k;
  }
  function cleanHashKeepRoute() {
    var h = String(location.hash || '');
    if (!h || (h.indexOf('api=') < 0 && h.indexOf('key=') < 0)) return;
    var next = h.replace(/(?:^#|&)(?:api|key)=[^&]*/g, '').replace(/^&/, '#').replace(/^#$/, '');
    try { history.replaceState(null, '', location.pathname + location.search + next); } catch (e) {}
  }
  var fromQ = '';
  try {
    var sp = new URLSearchParams(location.search || '');
    fromQ = sp.get('api') || '';
  } catch (e) {}
  var api = fromHash() || fromQ || '';
  var linkKey = keyFromHash();
  if (linkKey) {
    // saved once from the link, then removed from the address bar: a later reload never re-saves it, so a wrong or
    // locked key goes through the normal key prompt (no loop)
    try {
      if (localStorage.getItem('ops_key') !== linkKey) {
        localStorage.setItem('ops_key', linkKey);
        Object.keys(localStorage).forEach(function (k) { if (k.indexOf('opsnap:') === 0) localStorage.removeItem(k); });
      }
      // Kyle 12/11: the setup link also gives this device a new id, so a device locked by earlier wrong keys
      // works again at once (the page makes a fresh ops_cid on its next server call)
      localStorage.removeItem('ops_cid');
    } catch (e) {}
  }
  if (linkKey || /(?:^#|&)key=/.test(String(location.hash || ''))) cleanHashKeepRoute();
  if (api) {
    try { localStorage.setItem('ops_api', api); } catch (e) {}
    cleanHashKeepRoute();
  } else {
    try { api = localStorage.getItem('ops_api') || ''; } catch (e) { api = ''; }
  }
  if (!api) api = DEFAULT_API || '';
  window.OPS_API_URL = api;
  window.OPS_STATIC_SHELL = true;
  function showBanner(msg, bad) {
    var el = document.getElementById('ops-api-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ops-api-banner';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:sticky;top:0;z-index:9999;padding:8px 12px;font:13px/1.4 system-ui,sans-serif;'
        + 'background:#fef3c7;color:#92400e;border-bottom:1px solid #f59e0b;';
      document.body.insertBefore(el, document.body.firstChild);
    }
    el.style.background = bad ? '#fee2e2' : '#fef3c7';
    el.style.color = bad ? '#991b1b' : '#92400e';
    el.style.borderBottomColor = bad ? '#f87171' : '#f59e0b';
    el.innerHTML = msg;
  }

  if (!api && window.OPS_ENC && window.crypto && crypto.subtle) {
    var gateDec = function (pw) {
      var E = window.OPS_ENC, ub = function (b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(E.s), iterations: E.it }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      }).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(E.iv) }, k, ub(E.ct)); })
        .then(function (b) { return new TextDecoder().decode(b); });
    };
    document.addEventListener('DOMContentLoaded', function () {
      var g = document.createElement('div');
      g.id = 'ops-gate';
      g.style.cssText = 'position:fixed;inset:0;z-index:10001;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font:15px/1.4 system-ui,sans-serif';
      g.innerHTML = '<form id="ops-gate-form" style="background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.12);width:min(320px,86vw);text-align:center">'
        + '<img src="apple-touch-icon.png" alt="" style="width:64px;height:64px;border-radius:50%"><h2 style="margin:8px 0 14px;font-size:18px">SAM Novena Ops</h2>'
        + '<input id="ops-gate-pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Password" '
        + 'style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #d1d5db;border-radius:6px">'
        + '<button type="submit" id="ops-gate-go" style="margin-top:12px;width:100%;padding:10px;font-size:16px;background:#2563eb;color:#fff;border:0;border-radius:6px">Enter</button>'
        + '<div id="ops-gate-msg" style="margin-top:10px;min-height:1.4em;color:#b91c1c;font-size:14px"></div></form>';
      document.body.appendChild(g);
      var inp = document.getElementById('ops-gate-pw'), msg = document.getElementById('ops-gate-msg'), btn = document.getElementById('ops-gate-go');
      setTimeout(function () { inp.focus(); }, 50);
      document.getElementById('ops-gate-form').onsubmit = function (ev) {
        ev.preventDefault();
        var pw = String(inp.value || '').replace(/\s+/g, '').toLowerCase();
        if (!pw) { inp.focus(); return; }
        btn.disabled = true; msg.style.color = '#6b7280'; msg.textContent = 'Checking\u2026';
        gateDec(pw).then(function (u) {
          if (!/^https:\/\//.test(u)) throw new Error('bad');
          try {
            localStorage.setItem('ops_api', u); localStorage.setItem('ops_key', pw); localStorage.removeItem('ops_cid');
            Object.keys(localStorage).forEach(function (k) { if (k.indexOf('opsnap:') === 0) localStorage.removeItem(k); });
          } catch (e) {}
          location.reload();
        }, function () {
          btn.disabled = false; msg.style.color = '#b91c1c'; msg.textContent = 'Wrong password. Try again.'; inp.select();
        });
      };
    });
  } else if (!api) {
    document.addEventListener('DOMContentLoaded', function () {
      showBanner(
        "Ops · first time on this device: paste the Ops link, then the key (both kept only on this device). "
        + 'The access key is asked next. '
        + '<input id="ops-api-input" type="url" placeholder="https://script.google.com/macros/s/…/exec" '
        + 'style="width:min(520px,70vw);margin:4px 6px;padding:4px 8px;font:12px monospace">'
        + '<button type="button" id="ops-api-save" style="padding:4px 10px">Save</button>',
        true
      );
      var btn = document.getElementById('ops-api-save');
      var inp = document.getElementById('ops-api-input');
      if (btn && inp) btn.onclick = function () {
        var u = (inp.value || '').trim();
        if (!/^https:\/\//i.test(u)) { alert('Need an https /exec URL'); return; }
        try { localStorage.setItem('ops_api', u); } catch (e) {}
        window.OPS_API_URL = u;
        location.reload();
      };
    });
  } else {
    // Kyle 12/11: no banner once the device is set up; the two device buttons sit behind a small footer link
    document.addEventListener('DOMContentLoaded', function () {
      var box = document.createElement('div');
      box.id = 'ops-device';
      box.style.cssText = 'position:fixed;right:8px;bottom:6px;z-index:9998;font:11px/1.4 system-ui,sans-serif;text-align:right';
      box.innerHTML = '<div id="ops-device-panel" style="display:none;margin-bottom:4px;padding:8px;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)">'
        + '<div style="margin-bottom:6px;color:#374151">Link and key are saved on this device only.</div>'
        + '<button type="button" id="ops-api-clear" style="padding:2px 8px;font-size:12px">Clear saved API</button> '
        + '<button type="button" id="ops-key-forget" style="padding:2px 8px;font-size:12px">Forget password on this device</button></div>'
        + '<a href="javascript:void(0)" id="ops-device-toggle" style="color:#9ca3af;text-decoration:none">Device</a>';
      document.body.appendChild(box);
      var panel = document.getElementById('ops-device-panel');
      document.getElementById('ops-device-toggle').onclick = function () { panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; };
      document.getElementById('ops-api-clear').onclick = function () {
        try { localStorage.removeItem('ops_api'); } catch (e) {}
        location.reload();
      };
      document.getElementById('ops-key-forget').onclick = function () {
        try { localStorage.removeItem('ops_key'); Object.keys(localStorage).forEach(function (k) { if (k.indexOf('opsnap:') === 0) localStorage.removeItem(k); }); } catch (e) {}
        location.reload();
      };
    });
  }
})();
</script>

/**
 * v0.3.0: the save runs in the background. Rows show "saving\u2026", the page stays usable; the server returns the
 * fresh roster in the same call, which is drawn in place with a \u2713 per saved row. Marks changed while saving are kept.
 * On failure the marks stay unsaved and a Retry button appears.
 */
function rcSave() {
  if (RC.saving) return;
  var marks = [], bad = [], revs = {};
  RC.rows.forEach(function (row) {
    var m = RC.marks[row.student_id];
    if (!m.dirty || !m.status) return;
    var tg = parseTarget(m.makeup_of_event_id, { date: m.plan_date, start: m.plan_start, end: m.plan_end });
    if (m.makeup_of_event_id === MANUAL_TARGET && ['present', 'makeup'].indexOf(m.status) >= 0) {
      var msg = manualCheck({ date: m.plan_date, start: m.plan_start }, RC.r.date, RC.r.session_start);
      if (msg) { bad.push(row.name + ': ' + msg); return; }
    }
    var away = ['absent', 'excused', 'closure', 'suspended'].indexOf(m.status) >= 0;
    revs[row.student_id] = m.rev;
    marks.push({
      student_id: row.student_id, status: m.status,
      arrive_time: away && !m.arriveTouched ? '' : m.arrive_time, leave_time: away && !m.leaveTouched ? '' : m.leave_time,
      duration_h: m.duration_h, package_credit: m.package_credit, makeup_h: m.makeupTouched || m.makeup_h !== '' ? m.makeup_h : '',
      makeup_of_event_id: tg.makeup_of_event_id, plan_absence_date: tg.plan_absence_date, plan_absence_slot_id: tg.plan_absence_slot_id,
      plan_absence_start: tg.plan_absence_start, plan_absence_end: tg.plan_absence_end,
      regular_slot_id: row.regular_slot_id, slot_duration_h: row.slot_duration_h,
      session_start: row.session_start || row.slot_start || RC.r.session_start,
      join_reason: row.expected ? (m.join_reason === 'extension' ? 'extension' : '') : row.join_reason, notes: m.notes,
      absence_reason: m.absence_reason
    });
  });
  if (bad.length) { toast(bad.join('; '), 'bad'); return; }
  if (!marks.length) { toast('No changes'); return; }
  var payload = { date: RC.r.date, session_start: RC.r.session_start, session_end: RC.r.session_end, teacher: RC.r.teacher, marks: marks, return_roster: true };
  var tok = App.token, mine = RC;
  RC.saving = true;
  Object.keys(revs).forEach(function (sid) { RC.marks[sid].saving = true; });
  rcDrawRows();
  var btn = $('#rc-save'), wm = $('#rc-wmsg');
  if (btn) btn.disabled = true;
  if (wm) wm.innerHTML = '<span class="wstate saving">Saving ' + marks.length + '\u2026</span>';
  var t0 = nowMs();
  call('saveRollCall', payload).then(function (res) {
    wrote();
    var ms = Math.round(nowMs() - t0);
    var c = res.saved.filter(function (x) { return x.action === 'created'; }).length;
    var w = res.saved.filter(function (x) { return x.warning; }).map(function (x) { return x.warning; });
    var pa = res.saved.filter(function (x) { return x.planned_absence_created; }).map(function (x) { return x.planned_absence_id; });
    var msg = 'Saved ' + res.saved.length + ' (' + c + ' new, ' + (res.saved.length - c) + ' updated)' + (pa.length ? ' \u00B7 planned absence ' + pa.join(',') : '') + (w.length ? ' \u26A0 ' + w.join('; ') : '');
    toast(msg, w.length ? '' : 'ok');
    if (tok !== App.token || mine !== RC) return;
    var keep = rcUnsaved('', revs);
    var savedSids = res.saved.map(function (x) { return x.student_id; });
    var rem = res.reminders || null;
    if (rem) { setTodo(rem.counts.todo); App.lastReminders = rem; }
    var after = function (r) {
      if (tok !== App.token) return;
      rcRender(r, keep, savedSids);
      // v0.3.1: lesson counts + reminders come back with the save -> shown in place (Home / Inbox reload fresh data)
      if (rem) { RC.counts = rem.lesson_counts || {}; rcDrawRows(savedSids); rcShowReminders(rem.for_saved || []); }
      var wm2 = $('#rc-wmsg'); if (wm2) wm2.innerHTML = '<span class="wstate saved" title="' + ms + ' ms">\u2713 Saved</span>';
    };
    if (res.roster) after(res.roster);
    else call('getRoster', payload.date, payload.session_start, payload.teacher).then(after).catch(function () {});
  }).catch(function (e) {
    if (mine !== RC) { toast('Roll call not saved: ' + errMsg(e), 'bad'); return; }
    RC.saving = false;
    Object.keys(revs).forEach(function (sid) { if (RC.marks[sid]) RC.marks[sid].saving = false; });
    rcDrawRows();
    var b2 = $('#rc-save'); if (b2) b2.disabled = false;
    var wm3 = $('#rc-wmsg');
    if (wm3) { wm3.innerHTML = '<span class="wstate failed">' + notSaved_(e) + esc(errMsg(e)) + ' <button type="button" class="sm" id="rc-retry">Retry</button></span>'; $('#rc-retry').onclick = rcSave; }
    toast('Roll call not saved: ' + errMsg(e), 'bad');
  });
}

function ovFlash(id) {

  if (!el) return false;
  try { el.scrollIntoView({ block: 'center', inline: 'center' }); } catch (e) { /* old browsers */ }
  el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 3300);
  return true;
}
function ovEdit(D, id, btn) {
  var m = D.marks[id] || {};
  var get = ATT_EV_CACHE[id] ? Promise.resolve(ATT_EV_CACHE[id]) : call('getAttendanceEvent', id).then(function (ev) { attRemember([ev]); return ev; });
  get.then(function (ev) {

      .map(function (x) { return { event_id: x.id, date: x.d, session_start: x.st, status: x.status }; });
    var note = (m.lk && m.lk.length) ? '<p class="ov-lnk">' + (m.m === 'M' ? 'Makes up: ' : 'Made up by: ') + m.lk.map(function (l) { var y = D.marks[l.id]; return '<button type="button" class="ov-go" data-ovgo="' + esc(l.id) + '">' + esc(l.id) + ' \u00B7 ' + esc(y ? OV_WDN[y.wd] + ' ' + ovDmL(y.d) + ' ' + y.st : l.d) + '</button>'; }).join(', ') +

document.addEventListener('click', function (e) {

function downloadCsv(filename, csv) {
  try {
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }); // BOM so Excel reads UTF-8 names correctly
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast('Download started: ' + filename + ' (if nothing happens, use \u201CShow CSV text\u201D)');
  } catch (e) {
    toast('Download failed; use \u201CShow CSV text\u201D to copy: ' + errMsg(e), 'bad');
  }
}

    'New-student rule: first package + 12 lessons, with \u201CRenewal\u201D and \u201CNew \u2192 regular\u201D reminders.',
    'New sheet columns on Students, Trials and Lesson_Packages.'] },
  { v: 'v0.2.9.1', when: '3 Oct 2026 \u00B7 deployment Version 14', items: [

  { v: 'alpha 1.0.0', when: 'sheet stage \u00B7 set-up script dated 20 Sep 2026; data loaded 2 Oct 2026', items: [

];
function releaseNotesHtml() {
  return '<div class="card" id="set-release"><h3>Release notes <span class="en">' + RELEASE_NOTES.length + ' versions</span></h3>' + RELEASE_NOTES.map(function (r, i) {
    return '<details class="rn"' + (i === 0 ? ' open' : '') + ' data-v="' + esc(r.v) + '"><summary><b>' + esc(r.v) + '</b> <small class="muted">' + esc(r.when) + '</small></summary>' +
      '<ul>' + r.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details>';
  }).join('') + '</div>';
}

/* ---------------- Settings ---------------- */
App.routes.settings = function (root, ctx) {
  return load(call('getSettingsData')).then(function (s) {
    if (!ctx.alive()) return;
    var dh = s.data_health || {};
    var h = '<div class="card"><h3>App</h3><dl class="kv"><dt>Version</dt><dd>' + esc(s.version) + '</dd><dt>Today</dt><dd>' + esc(s.today) + ' ' + esc(s.term_week) + ' (' + esc(s.tz) + ')</dd>' +
      '<dt>URL</dt><dd>' + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.url) + '</a>' : '(not deployed / dialog mode)') + '</dd>' +
      '<dt>Mode</dt><dd>' + esc(App.mode) + '</dd><dt>Sheets</dt><dd>' + esc(s.sheets.join(', ')) + '</dd>' +
      (s.missing_tables.length ? '<dt>Missing tabs</dt><dd class="err">' + esc(s.missing_tables.join(', ')) + '</dd>' : '') +
      '<dt>v0.3.0 columns</dt><dd id="set-schema">' + ((s.missing_columns || []).length ? '<span class="b warn">Missing: ' + esc(s.missing_columns.map(function (m) { return m.table + ' (' + m.columns.join(', ') + ')'; }).join('; ')) + '</span>' : '<span class="b ok">All present</span>') + '</dd></dl></div>';
    // v0.3.0 speed: data cache + measured server call times
    h += '<div class="card" id="set-perf"><div class="row"><h3 style="margin:0">Speed</h3><button type="button" class="sm right" id="set-measure">Measure server reads</button><button type="button" class="sm" id="set-cache-clear">Refresh data cache</button></div>' +
      '<p class="muted">Rarely-changing tabs are cached on the server (CacheService) and refreshed automatically after every app write, after edits made in the sheet, and when the tab grows. Use \u201CRefresh data cache\u201D after bulk changes made in the sheet by a script.</p>' +
      '<div id="set-cache"><span class="muted">Loading cache status\u2026</span></div><div id="set-measured"></div>' +
      '<h4>Server calls this visit <small class="muted">(round trip, ms)</small></h4>' + perfTable() + '</div>';
    h += '<div class="card"><h3>Staff</h3>' + table([{ h: 'Teacher', k: 'teacher' }, { h: 'Centres', k: 'centres' }, { h: 'Programmes', k: 'programmes' },
      { h: 'Active', k: 'active' }, { h: 'SAM2 access', k: 'sam2_access' }, { h: 'Notes', k: 'notes', cls: 'note' }], s.staff) + '</div>';
    h += '<div class="card"><h3>Staff cover</h3>' + table([{ h: 'ID', k: 'cover_id' }, { h: 'Date', f: function (r) { return esc(dw(r.date)) + (r.end_date ? '\u2192' + esc(dw(r.end_date)) : ''); } },
      { h: 'On leave', k: 'absent_teacher' }, { h: 'Cover', k: 'cover_teacher' }, { h: 'Slots', k: 'slots' }, { h: 'Reason', k: 'reason', cls: 'note' }], s.staff_cover) + '</div>';
    h += '<div class="card"><div class="row"><h3 style="margin:0">Calendar exceptions</h3><button type="button" class="sm pri right" id="ce-new">+ New exception</button></div>' + table([
      { h: 'ID', k: 'exc_id' }, { h: 'Date', f: function (r) { return esc(dw(r.date)) + (r.end_date ? '\u2192' + esc(dw(r.end_date)) : ''); } }, { h: 'Scope', k: 'scope' },
      { h: 'Type', f: function (r) { return badge(r.type); } }, { h: 'Title', k: 'title', cls: 'note' }, { h: 'Makeup policy', k: 'makeup_policy' }, { h: 'Instructions', k: 'instructions', cls: 'note' }
    ], s.exceptions, { rowClass: function (r) { return r.date <= s.today && (r.end_date || r.date) >= s.today ? 'hl' : ''; } }) + '</div>';
    h += '<div class="card"><h3>Pacing targets</h3>' + table([{ h: 'ID', k: 'target_id' }, { h: 'Grade', k: 'grade_scope' },
      { h: 'Student', f: function (r) { return r.student_id ? sLink(r.student_id, studentName(r.student_id)) : ''; } }, { h: 'Level', k: 'curriculum_level' },
      { h: 'Target', k: 'target_booklet' }, { h: 'By', f: function (r) { return esc(dw(r.by_date)); } }, { h: 'Source', k: 'source', cls: 'note' }], s.pacing) + '</div>';
    h += '<div class="card"><details' + (ctx.params.term ? ' open' : '') + '><summary>Term calendar (' + s.term_calendar.length + ' weeks, this week ' + esc(s.term_week) + ')</summary>' + table([
      { h: 'Week key', k: 'week_key' }, { h: 'Term', k: 'term' }, { h: 'Week', k: 'week' }, { h: 'Start', k: 'start_date' }, { h: 'End', k: 'end_date' }, { h: 'Label', k: 'wb_label' }
    ], s.term_calendar, { rowClass: function (r) { return r.week_key === s.term_week ? 'hl' : ''; } }) + '</details></div>';
    h += releaseNotesHtml();
    root.innerHTML = h;
    var drawCache = function () {
      return call('getCacheStatus').then(function (cs) {
        var box = $('#set-cache'); if (!box) return;
        box.innerHTML = !cs.enabled ? '<p class="muted">Cache not available.</p>' : table([
          { h: 'Tab', k: 'table' }, { h: 'Cached', f: function (r) { return r.cached ? '<span class="b ok">Yes</span>' : '<span class="b">No</span>'; } },
          { h: 'Since', k: 'cached_at' }, { h: 'Chunks', num: 1, k: 'chunks' }, { h: 'Max age', num: 1, f: function (r) { return Math.round(r.ttl_s / 60) + ' min'; } }
        ], cs.tables);
      }).catch(function (e) { var box = $('#set-cache'); if (box) box.innerHTML = '<p class="err">' + esc(errMsg(e)) + '</p>'; });
    };
    drawCache();
    $('#set-cache-clear').onclick = function () {
      act(this, function () { return call('clearDataCache'); }, function (r) { return 'Data cache cleared (' + r.cleared + ' tabs); the next page load reads the sheet'; })
        .then(function () { App.pageCache = {}; return drawCache(); }).catch(function () {});
    };
    $('#set-measure').onclick = function () {
      var box = $('#set-measured');
      act(this, function () { return call('measureServer'); }, function (r) { return 'Measured in ' + r.total_ms + ' ms'; }).then(function (r) {
        if (!r || !box) return;
        box.innerHTML = '<h4>Server read time per tab <small class="muted">' + esc(r.at) + '</small></h4>' + table([{ h: 'Tab', k: 'table' }, { h: 'Rows', num: 1, k: 'rows' },
          { h: 'From sheet (ms)', num: 1, k: 'sheet_ms' }, { h: 'From cache (ms)', num: 1, f: function (x) { return x.cache_ms === null ? '\u2014' : esc(x.cache_ms); } }], r.tables);
        drawCache();
      }).catch(function () {});
    };
    $('#ce-new').onclick = function () {
      modal({ title: 'New calendar exception', ok: 'Create', body: '<div class="grid-form"><label class="f">Date<input type="date" name="date" value="' + s.today + '"></label><label class="f">End date<input type="date" name="end_date"></label>' +
        '<label class="f">Scope<input type="text" name="scope" value="novena" placeholder="all / novena / novena:SUN / teacher:Kyle / student:S0xx / grade:P6 / centre_home:lwsc"></label>' +
        '<label class="f">Type<select name="type">' + opts(['closure', 'public_holiday', 'teacher_leave', 'exam', 'event'], 'closure') + '</select></label>' +
        '<label class="f">Makeup policy<select name="makeup_policy">' + opts([['tbd', 'To be decided'], ['none', 'None'], ['extend', 'Extend'], ['makeup', 'Makeup']], 'tbd') + '</select></label>' +
        '<label class="f wide">Title<input type="text" name="title"></label><label class="f wide">Instructions<input type="text" name="instructions"></label>' +
        '<label class="f wide">Source<input type="text" name="source"></label></div>', validate: function (d) { if (!d.date) return 'Pick a date'; if (!d.title) return 'Enter a title'; } }).then(function (d) {
        if (!d) return;
        act(null, function () { return call('addCalendarException', d); }, function (r) { return 'Created ' + r.exc_id; }).then(function () { softRoute(); }).catch(function () {});
      });
    };
  });
};
function perfTable() {
  var rows = App.perf.slice().reverse();
  if (!rows.length) return '<p class="muted">No calls yet.</p>';
  var by = {};
  App.perf.forEach(function (r) { var b = by[r.fn] = by[r.fn] || { fn: r.fn, n: 0, sum: 0, max: 0 }; b.n++; b.sum += r.ms; b.max = Math.max(b.max, r.ms); });
  return table([{ h: 'Call', k: 'fn' }, { h: 'Count', num: 1, k: 'n' }, { h: 'Average', num: 1, f: function (r) { return Math.round(r.sum / r.n); } }, { h: 'Slowest', num: 1, k: 'max' }],
    Object.keys(by).map(function (k) { return by[k]; })) +
    '<details><summary class="muted">Last ' + rows.length + ' calls</summary>' + table([{ h: 'Time', k: 'at' }, { h: 'Call', k: 'fn' }, { h: 'ms', num: 1, k: 'ms' }, { h: 'OK', f: function (r) { return r.ok ? '\u2713' : '\u2717'; } }], rows) + '</details>';
}
</script>
